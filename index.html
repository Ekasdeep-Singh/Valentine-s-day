<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Interactive Experience</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffcccc; text-align: center; }
        h1 { color: #ff0055; }
        .heart { font-size: 100px; color: red; }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <div class="heart">❤️</div>
    <p>Click the heart for a surprise!</p>
    <script>
        document.querySelector('.heart').addEventListener('click', function() {
            alert("Happy Valentine's Day! Spread love and joy!");
        });
    </script>
</body>
</html>
